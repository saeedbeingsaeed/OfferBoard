<div class="card mt-6 flex flex-col items-center px-6 py-14 text-center">
  <div class="grid size-12 place-items-center rounded-full bg-brand-50 text-brand-600 dark:bg-brand-950 dark:text-brand-400" aria-hidden="true">
    <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="6" rx="1.5"/></svg>
  </div>
  <h2 class="mt-4 text-base font-semibold">{{ title }}</h2>
  <p class="mt-1 max-w-sm text-sm text-zinc-600 dark:text-zinc-400">{{ body }}</p>
  {% if action_url %}<a href="{{ action_url }}" class="btn btn-primary mt-6">{{ action_label }}</a>{% endif %}
</div>
