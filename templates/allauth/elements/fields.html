{% if attrs.form.non_field_errors %}
  <div class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-800 dark:border-rose-900 dark:bg-rose-950 dark:text-rose-200" role="alert">
    {% for error in attrs.form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
  </div>
{% endif %}
{% for field in attrs.form.hidden_fields %}{{ field }}{% endfor %}
{% for field in attrs.form.visible_fields %}
  {% include "partials/form_field.html" %}
{% endfor %}
