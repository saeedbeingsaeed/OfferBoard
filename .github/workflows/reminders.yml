# Sends the daily reminder emails, and deletes demo accounts older than a day.
#
# Runs in GitHub Actions rather than on Render because Render's free tier
# blocks outgoing email (SMTP) and puts the web server to sleep. It also touches
# the database every day, which stops the free Supabase project from pausing.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL   the same Supabase session pooler URI that Render uses
#   SECRET_KEY     the same value as on Render, so unsubscribe links work there
#   SMTP_USERNAME  the Offerboard Gmail address
#   SMTP_PASSWORD  its 16-character Gmail app password
# and this repository variable:
#   SITE_URL       e.g. https://offerboard.onrender.com (used for links in emails)

name: Daily reminders

on:
  schedule:
    # 12:20 UTC = 8:20 AM in Toronto in summer (7:20 AM in winter). GitHub may
    # start scheduled runs a few minutes late; the exact minute doesn't matter.
    - cron: "20 12 * * *"
  workflow_dispatch: # adds a "Run workflow" button for manual runs
    inputs:
      dry_run:
        description: "Only list who would be emailed"
        type: boolean
        default: true

# Never run two at once (e.g. a manual run during the scheduled one).
concurrency:
  group: reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SITE_URL: ${{ vars.SITE_URL }}
      TIME_ZONE: America/Toronto
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Delete expired demo accounts
        if: ${{ !inputs.dry_run }}
        run: python manage.py purge_demo_users
      - name: Send reminders
        run: python manage.py send_reminders ${{ inputs.dry_run && '--dry-run' || '' }}
